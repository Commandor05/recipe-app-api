# Devcontainer-specific compose — mirrors docker-compose.yml but omits `ports`
# (port forwarding is handled by devcontainer.json forwardPorts instead).
# For regular local development, use the root docker-compose.yml directly.

services:
  app:
    build:
      context: ..
      args:
        - DEV=true
    volumes:
      - ..:/workspace
      - ../app:/app
    command: ["sh", "-c", "python manage.py wait_for_db && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"]
    environment:
      - DB_HOST=db
      - DB_NAME=devdb
      - DB_USER=devuser
      - DB_PASSWORD=changme
    depends_on:
      - db

  db:
    image: postgres:13-alpine
    volumes:
      - dev-db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=devdb
      - POSTGRES_USER=devuser
      - POSTGRES_PASSWORD=changme

volumes:
  dev-db-data:
